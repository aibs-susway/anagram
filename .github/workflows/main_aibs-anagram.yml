# Builds and deploys the Anagram Node.js app to Azure Web App - aibs-anagram.
# Docs: https://github.com/Azure/webapps-deploy
name: Build and deploy Node.js app to Azure Web App - aibs-anagram

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies and run checks
        run: |
          npm install --production
          node tests/deploy-check.js
          npm run test --if-present

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp package.json package-lock.json server.js index.html web.config iisnode.yml .deployment deploy/
          cp -r tests deploy/ 2>/dev/null || true
          rm -f deploy/data.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # Guard against the most common cause of:
      #   "Publish profile is invalid for app-name and slot-name provided"
      # An empty/whitespace secret or a truncated paste fails before Azure is called.
      - name: Validate publish profile secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A91D4C023CE0485E8457BF799F1458F0 }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::The secret AZUREAPPSERVICE_PUBLISHPROFILE_A91D4C023CE0485E8457BF799F1458F0 is empty or not set."
            exit 1
          fi
          if ! printf '%s' "$PUBLISH_PROFILE" | grep -q "<publishData"; then
            echo "::error::The publish profile secret does not look like a .PublishSettings XML file (no <publishData> element). Re-download it from the App Service Overview and re-add the secret."
            exit 1
          fi
          echo "Publish profile format looks valid."

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'aibs-anagram'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A91D4C023CE0485E8457BF799F1458F0 }}